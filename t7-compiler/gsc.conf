# ZPause T7 -- t7-compiler project config.
#
# The compiler injects a compiled script over a stock one. duplicaterender_mgr
# is the compiler's own default and does nothing in zombies, which makes it a
# safe slot -- but it is also the slot every tutorial-following script uses,
# and two scripts cannot share one. If something else already occupies it,
# point this at another script you are not using and rebuild.

symbols=zm
game=t7
script=scripts/shared/duplicaterender_mgr.gsc
